
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #2980b9, #8e44ad);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1a5276;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>

        <form onsubmit="return login()">

            <input type="text" id="username"
                   placeholder="Enter Username" required>

            <input type="password" id="password"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>
    </div>

    <script>
        function login() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;

            if (username === "admin" &&
                password === "12345") {

                document.getElementById("message").innerHTML =
                    "Login Successful!";

                document.getElementById("message").style.color =
                    "green";

            } else {

                document.getElementById("message").innerHTML =
                    "Invalid Username or Password!";

                document.getElementById("message").style.color =
                    "red";
            }

            return false;
        }
    </script>

</body>
</html>
